name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '008826676356'
  TF_VERSION: '1.10.5'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  STATE_BUCKET: terraform-state-008826676356-us-east-1
  STATE_KEY: terraform.tfstate

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create or verify Terraform state bucket
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking bucket ownership: $STATE_BUCKET"
          owned=$(aws s3api list-buckets \
            --query "Buckets[?Name=='${STATE_BUCKET}'].Name | [0]" \
            --output text)
          if [[ "$owned" != "$STATE_BUCKET" ]]; then
            echo "Bucket not found in this AWS account. Attempting creation."
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket \
                --bucket "$STATE_BUCKET" \
                --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          else
            echo "Bucket already owned by this account."
          fi
          aws s3api head-bucket \
            --bucket "$STATE_BUCKET" \
            --expected-bucket-owner "$AWS_ACCOUNT_ID"
          aws s3api put-bucket-versioning \
            --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled \
            --expected-bucket-owner "$AWS_ACCOUNT_ID"
          echo "S3 state bucket is ready."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform version
        run: terraform version

      - name: Terraform init
        run: terraform init -reconfigure -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform Apply (production approval)
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubTerraformApply


      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform version
        run: terraform version

      - name: Terraform init
        run: terraform init -reconfigure -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform apply
        run: terraform apply -input=false tfplan
